services:
  - type: web
    name: alimentared-backend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: ohio
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        value: jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DB_USERNAME
        value: postgres.icnpffaunpbfjlkgctjj
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DDL_AUTO
        value: none
      - key: ALIMENTARED_SCHEDULING_ENABLED
        value: "true"
      - key: ALIMENTARED_SEED_HABILITADO
        value: "true"
