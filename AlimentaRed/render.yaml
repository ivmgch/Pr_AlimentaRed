services:
  - type: web
    name: alimentared-backend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: ohio
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DDL_AUTO
        value: update
      - key: ALIMENTARED_SCHEDULING_ENABLED
        value: "true"
      - key: ALIMENTARED_SEED_HABILITADO
        value: "true"
